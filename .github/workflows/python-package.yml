# This workflow will install Python dependencies, run formatting checks, and execute pytest tests.
name: Python package (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install package with all dev-dependencies defined in pyproject.toml
        pip install -e ".[dev]"

    - name: CI checks (pre-commit)
      run: |
        # Run pre-commit to check code format and Ruff linting
        # (simulates running all configured hooks across all files)
        pre-commit run --all-files

    - name: Test with pytest
      run: |
        # Execute tests and check code coverage
        pytest tests/ --cov=kahi --cov-report=xml
