# This workflow will build and upload a Python Package to PyPI when a release is created
name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Recommended security setup for publishing to PyPI via trusted publishing OIDC
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package (PEP 517/621)
      run: |
        python -m build

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      # Note: PyPI OIDC token requires project config on PyPI to trust GitHub
      # If still using secrets, you can comment this action out and use twine below:
      # env:
      #   TWINE_USERNAME: __token__
      #   TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      # run: twine upload dist/*
